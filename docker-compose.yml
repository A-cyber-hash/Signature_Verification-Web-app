# SignaSecure Enterprise Docker Configuration
version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: signasecure_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SignaSecure2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-signasecure_enterprise}
      MYSQL_USER: ${MYSQL_USER:-signasecure}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SignaSecure2024!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - signasecure_network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: signasecure_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - signasecure_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signasecure_backend
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DB_NAME=${MYSQL_DATABASE:-signasecure_enterprise}
      - DB_USER=${MYSQL_USER:-signasecure}
      - DB_PASSWORD=${MYSQL_PASSWORD:-SignaSecure2024!}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - mysql
      - redis
    networks:
      - signasecure_network
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signasecure_celery
    command: celery -A config worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DB_NAME=${MYSQL_DATABASE:-signasecure_enterprise}
      - DB_USER=${MYSQL_USER:-signasecure}
      - DB_PASSWORD=${MYSQL_PASSWORD:-SignaSecure2024!}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - signasecure_network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signasecure_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DB_NAME=${MYSQL_DATABASE:-signasecure_enterprise}
      - DB_USER=${MYSQL_USER:-signasecure}
      - DB_PASSWORD=${MYSQL_PASSWORD:-SignaSecure2024!}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - signasecure_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signasecure_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - signasecure_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: signasecure_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - backend
      - frontend
    networks:
      - signasecure_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  signasecure_network:
    driver: bridge